<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sawarna Trip 🛵✨</title>

    <!-- 1. LIBRARY EFEK CONFETTI CANVAS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #ffeef2;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-color: #4a3e3d;
            --accent-color: #ff6b8b;
            --time-bg: #ffe0e6;
            --time-color: #d81b60;
            --desc-color: #666;
            --border-color: #ffcad4;
        }

        body.dark-mode {
            --bg-color: #1a0b12;
            --card-bg: rgba(35, 18, 26, 0.9);
            --text-color: #f3d2dc;
            --accent-color: #ff4d7d;
            --time-bg: #3a1523;
            --time-color: #ff85a2;
            --desc-color: #b58d99;
            --border-color: #4d1c2c;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        h1 {
            color: var(--accent-color);
            margin: 5px 0;
            font-size: 26px;
        }

        .theme-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 10px;
        }

        /* COUNTDOWN TIMER CARD */
        .countdown-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.15);
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .time-block {
            background: var(--time-bg);
            padding: 8px;
            border-radius: 10px;
            min-width: 55px;
        }

        .time-block span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: var(--time-color);
        }

        .time-block label {
            font-size: 10px;
            color: var(--text-color);
        }

        /* MINI AUDIO PLAYER */
        .audio-player {
            background: var(--card-bg);
            border-radius: 50px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 139, 0.15);
            border: 1px solid var(--border-color);
        }

        .play-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .song-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .song-title {
            font-size: 13px;
            font-weight: bold;
            white-space: nowrap;
        }

        .song-artist {
            font-size: 11px;
            color: var(--desc-color);
        }

        .sound-wave {
            display: flex;
            gap: 2px;
            align-items: center;
            height: 15px;
        }

        .bar {
            width: 3px;
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .sound-wave.playing .bar {
            animation: bounce 0.5s ease infinite alternate;
        }

        .sound-wave.playing .bar:nth-child(2) { animation-delay: 0.1s; }
        .sound-wave.playing .bar:nth-child(3) { animation-delay: 0.2s; }
        .sound-wave.playing .bar:nth-child(4) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 20%; }
            100% { height: 100%; }
        }

        /* CARD AGENDA & CHECKLIST */
        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 16px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 14px;
            cursor: pointer;
            position: relative;
        }

        .item input[type="checkbox"] {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-color);
            border-radius: 6px;
            margin-right: 12px;
            margin-top: 2px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .item input[type="checkbox"]:checked + .checkmark {
            background-color: var(--accent-color);
        }

        .item input[type="checkbox"]:checked + .checkmark::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .item-content {
            flex-grow: 1;
        }

        .time {
            display: inline-block;
            background: var(--time-bg);
            color: var(--time-color);
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
        }

        .item input[type="checkbox"]:checked ~ .item-content .title {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .desc {
            font-size: 12px;
            color: var(--desc-color);
            margin-top: 2px;
        }

        .note-box {
            background: var(--time-bg);
            color: var(--time-color);
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            margin-top: 10px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header>
            <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙 Mode Malam Pink</button>
            <h1>Sawarna Trip 🛵✨</h1>
            <p style="font-size: 13px; margin: 0; opacity: 0.8;">Petualangan Bersama ke Pantai Sawarna</p>
        </header>

        <!-- COUNTDOWN CARD -->
        <div class="countdown-card">
            <span style="font-size: 12px; font-weight: bold;">COUNTDOWN TO TRIP 🌊</span>
            <div class="countdown-timer">
                <div class="time-block"><span id="days">0</span><label>Hari</label></div>
                <div class="time-block"><span id="hours">0</span><label>Jam</label></div>
                <div class="time-block"><span id="minutes">0</span><label>Menit</label></div>
                <div class="time-block"><span id="seconds">0</span><label>Detik</label></div>
            </div>
        </div>

        <!-- AUDIO PLAYER (I'm Yours - Jason Mraz) -->
        <div class="audio-player">
            <button class="play-btn" id="audioPlayBtn" onclick="toggleAudio()">▶</button>
            <div class="song-info">
                <div class="song-title">I'm Yours</div>
                <div class="song-artist">Jason Mraz 🎶</div>
            </div>
            <div class="sound-wave" id="soundWave">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
        <!-- DIRECT LINK AUDIO JASON MRAZ -->
        <audio id="bgAudio" src="https://archive.org/download/clangers13/I%27m%20Yours%20-%20Jason%20Miraz.mp3" preload="auto"></audio>

        <!-- CARD 1: PERSIAPAN -->
        <div class="card">
            <h3>PERSIAPAN SEBELUM BERANGKAT</h3>
            
            <label class="item">
                <input type="checkbox" id="item1">
                <span class="checkmark"></span>
                <div class="item-content">
                    <div class="title">Servis Motor & Cek Bensin Full 🛵</div>
                    <div class="desc">Cek oli, rem, ban, dan ketersediaan bensin.</div>
                </div>
            </label>

            <label class="item">
                <input type="checkbox" id="item2">
                <span class="checkmark"></span>
                <div class="item-content">
                    <div class="title">Packing Baju & Perlengkapan Pantai 👙📸</div>
                    <div class="desc">Bawa baju ganti, jas hujan, sunblock, charger, dan obat pribadi.</div>
                </div>
            </label>
        </div>

        <!-- CARD 2: HARI 1 -->
        <div class="card">
            <h3>HARI 1 - JUMAT, 10 JULI 2026</h3>
            
            <label class="item">
                <input type="checkbox" id="item3">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">05.00 - 11.00</span>
                    <div class="title">Perjalanan Touring Serang - Sawarna 🛵💨</div>
                    <div class="desc">Start pagi biar tidak panas dan santai di jalan.</div>
                </div>
            </label>

            <label class="item">
                <input type="checkbox" id="item4">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">11.00 - 13.00</span>
                    <div class="title">Check-in Homestay & Istirahat 🏡</div>
                    <div class="desc">Makan siang dan rapi-rapi barang.</div>
                </div>
            </label>

            <label class="item">
                <input type="checkbox" id="item5">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">15.30 - 18.00</span>
                    <div class="title">Main di Pantai Tanjung Layar & Sunset 🌅</div>
                    <div class="desc">Foto-foto di batu karang ikonik dan nikmati sore.</div>
                </div>
            </label>
        </div>

        <!-- CARD 3: HARI 2 -->
        <div class="card">
            <h3>HARI 2 - SABTU, 11 JULI 2026</h3>

            <label class="item">
                <input type="checkbox" id="item6">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">06.00 - 09.00</span>
                    <div class="title">Eksplor Goa Lalay & Pantai Ciantir 🦇🌊</div>
                    <div class="desc">Jalan-jalan pagi dan menikmati udara segar.</div>
                </div>
            </label>

            <label class="item">
                <input type="checkbox" id="item7">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">19.00 - Selesai</span>
                    <div class="title">Seafood Party & Santai Malam 🐟🔥</div>
                    <div class="desc">Makan malam ikan bakar sambil dengerin musik.</div>
                </div>
            </label>
        </div>

        <!-- CARD 4: HARI 3 -->
        <div class="card">
            <h3>HARI 3 - MINGGU, 12 JULI 2026</h3>

            <label class="item">
                <input type="checkbox" id="item8">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">13.00 - 17.30</span>
                    <div class="title">Perjalanan Naik Motor Kembali ke Serang 🛵💨</div>
                    <div class="desc">Lebih aman jalan siang agar melewati jalur Gunung Kencana sebelum gelap.</div>
                </div>
            </label>

            <!-- ITEM PENUTUP PEMICU CONFETTI HATI -->
            <label class="item">
                <input type="checkbox" id="item9">
                <span class="checkmark"></span>
                <div class="item-content">
                    <span class="time">17.30 - Selesai</span>
                    <div class="title">Sawarna Trip Approved! 🎉💖</div>
                    <div class="desc">Tiba di rumah dengan selamat. Semua destinasi berhasil dicentang, tapi cintaku padamu ga akan pernah ada habisnya!</div>
                </div>
            </label>
        </div>

        <!-- CARD 5: ATURAN MAIN -->
        <div class="card">
            <h3>ATURAN MAIN ⚠️</h3>
            <label class="item">
                <input type="checkbox" id="item10">
                <span class="checkmark"></span>
                <div class="item-content">
                    <div class="title">Dilarang Cemberut selama Perjalanan 😁</div>
                </div>
            </label>
            <label class="item">
                <input type="checkbox" id="item11">
                <span class="checkmark"></span>
                <div class="item-content">
                    <div class="title">Saling Mengingatkan Safety Riding ⛑️</div>
                </div>
            </label>
        </div>

    </div>

    <!-- ⚙️ LOGIKA JAVASCRIPT LENGKAP -->
    <script>
        // 1. OTOMATIS SIMPAN CHECKLIST & PENGECEKAN KELENGKAPAN
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');

        function checkAllCompleted() {
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            if (allChecked && checkboxes.length > 0) {
                launchHeartConfetti();
            }
        }

        checkboxes.forEach(checkbox => {
            if (localStorage.getItem(checkbox.id) === 'true') {
                checkbox.checked = true;
            }
            checkbox.addEventListener('change', () => {
                localStorage.setItem(checkbox.id, checkbox.checked);
                checkAllCompleted();
            });
        });

        // Cek status saat pertama kali halaman dimuat
        setTimeout(checkAllCompleted, 1000);

        // 2. KEMBANG API / CONFETTI BERBENTUK HATI (HEART SHAPE)
        function launchHeartConfetti() {
            var heart = confetti.shapeFromPath({
                path: 'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'
            });

            var duration = 3.5 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 4,
                    angle: 60,
                    spread: 60,
                    origin: { x: 0, y: 0.7 },
                    shapes: [heart],
                    scalar: 2,
                    colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffffff', '#c9184a']
                });

                confetti({
                    particleCount: 4,
                    angle: 120,
                    spread: 60,
                    origin: { x: 1, y: 0.7 },
                    shapes: [heart],
                    scalar: 2,
                    colors: ['#ff4d6d', '#ff758f', '#ffb3c1', '#ffffff', '#c9184a']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            })();
        }

        // 3. LOGIKA COUNTDOWN TIMER
        const targetDate = new Date("August 10, 2026 05:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            } else {
                document.getElementById("days").innerText = 0;
                document.getElementById("hours").innerText = 0;
                document.getElementById("minutes").innerText = 0;
                document.getElementById("seconds").innerText = 0;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 4. LOGIKA TOGGLE DARK MODE
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            const btn = document.getElementById("themeToggleBtn");
            if (document.body.classList.contains("dark-mode")) {
                btn.innerHTML = "☀️ Mode Terang Pink";
            } else {
                btn.innerHTML = "🌙 Mode Malam Pink";
            }
        }

        // 5. LOGIKA MINI AUDIO PLAYER
        const audio = document.getElementById("bgAudio");
        const playBtn = document.getElementById("audioPlayBtn");
        const soundWave = document.getElementById("soundWave");

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                playBtn.innerHTML = "❚❚";
                soundWave.classList.add("playing");
            } else {
                audio.pause();
                playBtn.innerHTML = "▶";
                soundWave.classList.remove("playing");
            }
        }

        audio.onended = function() {
            playBtn.innerHTML = "▶";
            soundWave.classList.remove("playing");
        };
    </script>
</body>
</html>
